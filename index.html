<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranking Colegios Rancagua · PAES · SIMCE · Arancel</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#f7f8fc;--white:#fff;--navy:#0d1b3e;--blue:#1a3fa3;--blue-light:#e8effe;
    --red:#c0392b;--gold:#e8a020;--green:#1e7e4a;--green-light:#e8f7ee;
    --gray:#64748b;--gray-light:#f1f5f9;--border:#e2e8f0;
    --shadow:0 2px 16px rgba(13,27,62,.08);--shadow-lg:0 8px 40px rgba(13,27,62,.14);
    --radius:14px;--radius-sm:8px;
    --font:'Sora',sans-serif;--font-body:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--bg);color:var(--navy);min-height:100vh}
  
  /* ── HEADER ── */
  .header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3fa3 60%,#2952cc 100%);
    color:#fff;padding:32px 24px 24px;position:relative;overflow:hidden}
  .header::before{content:'';position:absolute;top:-40px;right:-60px;width:280px;height:280px;
    border-radius:50%;background:rgba(255,255,255,.04)}
  .header::after{content:'';position:absolute;bottom:-60px;left:40%;width:200px;height:200px;
    border-radius:50%;background:rgba(255,255,255,.03)}
  .header-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto}
  .header-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .header-icon{font-size:36px}
  .header-title{font-family:var(--font);font-size:22px;font-weight:800;letter-spacing:-.3px}
  .header-sub{font-size:12px;opacity:.75;margin-top:2px;font-weight:300}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .kpi{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;
    display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
  .kpi-icon{font-size:16px}
  .kpi-label{font-size:10px;opacity:.75;font-family:var(--font-body)}
  .kpi-val{font-size:14px;font-weight:700;font-family:var(--font)}

  /* ── CONTROLS ── */
  .controls{max-width:1100px;margin:20px auto;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap input{width:100%;padding:10px 14px 10px 38px;border:2px solid var(--border);
    border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;
    background:var(--white);color:var(--navy);outline:none;transition:border .2s}
  .search-wrap input:focus{border-color:var(--blue)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px}
  .filter-btn{padding:10px 16px;border-radius:var(--radius-sm);border:2px solid var(--border);
    background:var(--white);font-family:var(--font-body);font-size:13px;cursor:pointer;
    color:var(--navy);transition:all .2s;font-weight:500}
  .filter-btn.active,.filter-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
  .sort-select{padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);
    background:var(--white);font-family:var(--font-body);font-size:13px;color:var(--navy);outline:none;cursor:pointer}

  /* ── GRID ── */
  .grid{max-width:1100px;margin:0 auto;padding:0 18px 40px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

  /* ── CARD ── */
  .card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:default}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card-accent{height:5px}
  .card-body{padding:18px}
  .card-rank{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rank-badge{font-family:var(--font);font-weight:800;font-size:13px;padding:4px 10px;
    border-radius:6px;background:var(--blue-light);color:var(--blue)}
  .tipo-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px}
  .tipo-muni{background:var(--green-light);color:var(--green)}
  .tipo-priv{background:var(--blue-light);color:var(--blue)}
  .tipo-subv{background:#fef3c7;color:#92400e}

  /* ── CITY TABS ── */
  .city-tab{padding:8px 18px;border-radius:20px;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);color:#fff;font-family:var(--font);font-weight:700;
    font-size:13px;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
  .city-tab:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
  .city-tab.active{background:#fff;color:var(--navy);border-color:#fff}
  .card-name{font-family:var(--font);font-weight:700;font-size:15px;color:var(--navy);
    margin-bottom:6px;line-height:1.3}
  .card-desc{font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.5}
  .metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .metric{background:var(--gray-light);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
  .metric-label{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600}
  .metric-val{font-family:var(--font);font-size:18px;font-weight:800;color:var(--navy);line-height:1}
  .metric-sub{font-size:10px;color:var(--gray);margin-top:3px}
  .card-arancel{display:flex;justify-content:space-between;align-items:center;
    background:var(--gray-light);border-radius:var(--radius-sm);padding:10px 12px}
  .arancel-label{font-size:11px;color:var(--gray);font-weight:600}
  .arancel-val{font-family:var(--font);font-weight:800;font-size:15px}
  .arancel-gratis{color:var(--green)}
  .arancel-paid{color:var(--gold)}
  .fuente-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:6px}
  .fuente-estimado{background:#dbeafe;color:#1d4ed8}
  .fuente-referencial{background:#fff7ed;color:#c2410c}
  .fuente-verificado{background:var(--green-light);color:var(--green)}
  .bilingue-tag{font-size:10px;background:#f3e8ff;color:#7c3aed;padding:2px 7px;border-radius:5px;font-weight:700;margin-left:6px}

  /* ── BAR ── */
  .bar-wrap{margin-top:2px}
  .bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .bar-label{font-size:10px;color:var(--gray);width:12px;font-weight:600}
  .bar-track{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s}
  .bar-val{font-size:11px;font-weight:700;min-width:24px;text-align:right}

  /* ── ADMIN BUTTON ── */
  .admin-fab{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
    border:none;border-radius:50px;padding:12px 20px;font-family:var(--font);font-weight:700;
    font-size:13px;cursor:pointer;box-shadow:0 4px 20px rgba(13,27,62,.3);
    display:flex;align-items:center;gap:8px;transition:all .2s;z-index:100}
  .admin-fab:hover{background:var(--blue);transform:translateY(-2px)}

  /* ── MODAL OVERLAY ── */
  .overlay{position:fixed;inset:0;background:rgba(13,27,62,.6);backdrop-filter:blur(4px);
    z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .overlay.hidden{display:none}
  .modal{background:var(--white);border-radius:18px;box-shadow:var(--shadow-lg);
    width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
  .modal-title{font-family:var(--font);font-weight:800;font-size:17px;color:var(--navy)}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray);padding:4px}
  .modal-body{padding:20px 24px 24px}

  /* ── ADMIN PANEL ── */
  .admin-panel{background:var(--white);border-radius:18px;box-shadow:var(--shadow-lg);
    width:100%;max-width:800px;max-height:92vh;overflow-y:auto}
  .admin-header{background:var(--navy);color:#fff;padding:20px 24px;
    border-radius:18px 18px 0 0;display:flex;justify-content:space-between;align-items:center}
  .admin-title{font-family:var(--font);font-weight:800;font-size:17px}
  .admin-body{padding:20px 24px}
  .school-row{display:flex;align-items:center;gap:10px;padding:12px 0;
    border-bottom:1px solid var(--border)}
  .school-row-name{flex:1;font-weight:600;font-size:14px;color:var(--navy)}
  .school-row-meta{font-size:12px;color:var(--gray)}
  .btn{padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;
    font-family:var(--font-body);font-weight:600;font-size:13px;transition:all .15s}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#1230a0}
  .btn-danger{background:#fee2e2;color:var(--red)}
  .btn-danger:hover{background:var(--red);color:#fff}
  .btn-sm{padding:5px 10px;font-size:11px}
  .btn-success{background:var(--green-light);color:var(--green)}
  .btn-success:hover{background:var(--green);color:#fff}
  .btn-outline{background:transparent;border:2px solid var(--border);color:var(--navy)}
  .btn-outline:hover{border-color:var(--blue);color:var(--blue)}
  .btn-gold{background:#fff7ed;color:var(--gold)}
  .btn-gold:hover{background:var(--gold);color:#fff}

  /* ── FORM ── */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-group{display:flex;flex-direction:column;gap:5px}
  .form-group.full{grid-column:1/-1}
  .form-label{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
  .form-input{padding:9px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font-body);font-size:13px;color:var(--navy);outline:none;transition:border .15s}
  .form-input:focus{border-color:var(--blue)}
  .form-select{padding:9px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font-body);font-size:13px;color:var(--navy);outline:none;background:var(--white)}
  .form-input.small{padding:7px 10px;font-size:12px}
  textarea.form-input{resize:vertical;min-height:70px}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

  /* ── LOGIN ── */
  .login-box{text-align:center;padding:32px 24px}
  .login-icon{font-size:48px;margin-bottom:12px}
  .login-title{font-family:var(--font);font-weight:800;font-size:18px;color:var(--navy);margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--gray);margin-bottom:24px}
  .login-error{background:#fee2e2;color:var(--red);padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}

  /* ── DEPLOY GUIDE ── */
  .deploy-step{display:flex;gap:14px;margin-bottom:20px}
  .step-num{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font);
    font-weight:800;font-size:14px;flex-shrink:0}
  .step-content{}
  .step-title{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:4px}
  .step-desc{font-size:13px;color:var(--gray);line-height:1.55}
  .step-link{color:var(--blue);font-weight:600;text-decoration:none}
  .step-link:hover{text-decoration:underline}
  .code-block{background:var(--navy);color:#a8d8ff;padding:10px 14px;border-radius:8px;
    font-family:monospace;font-size:12px;margin-top:6px;line-height:1.6}
  .highlight{background:#fff3cd;padding:12px 16px;border-radius:8px;border-left:4px solid var(--gold);
    font-size:13px;color:var(--navy);margin-bottom:16px}

  /* ── EMPTY ── */
  .empty{text-align:center;padding:60px 20px;color:var(--gray)}
  .empty-icon{font-size:48px;margin-bottom:12px}

  /* ── TABS ── */
  .admin-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .atab{padding:8px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);
    background:var(--white);font-family:var(--font-body);font-size:12px;cursor:pointer;
    color:var(--gray);transition:all .15s;font-weight:600}
  .atab.active{background:var(--navy);border-color:var(--navy);color:#fff}

  /* ── NOTIF ── */
  .notif{position:fixed;top:20px;right:20px;background:var(--navy);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow-lg);z-index:9999;transform:translateX(120%);transition:transform .3s}
  .notif.show{transform:translateX(0)}

  /* ── NO RESULTS ── */
  .no-results{grid-column:1/-1;text-align:center;padding:60px;color:var(--gray)}

  @media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .metrics{grid-template-columns:1fr 1fr}
    .form-grid{grid-template-columns:1fr}
    .kpis{gap:7px}
    .kpi{padding:6px 10px}
  }
</style>
</head>
<body>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <span class="header-icon">🏫</span>
      <div>
        <div class="header-title">Ranking Colegios · Rancagua</div>
        <div class="header-sub" id="headerSub">PAES 2025 · SIMCE 4° básico 2024 · Aranceles 2025</div>
      </div>
    </div>
    <!-- CITY TABS -->
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="city-tab active" id="tab-Rancagua" onclick="setCity('Rancagua',this)">🏙️ Rancagua</button>
      <button class="city-tab" id="tab-Machalí" onclick="setCity('Machalí',this)">🌿 Machalí</button>
      <button class="city-tab" id="tab-Graneros" onclick="setCity('Graneros',this)">🏘️ Graneros</button>
      <button class="city-tab" id="tab-todas" onclick="setCity('todas',this)">🗺️ Todas las comunas</button>
      <button class="city-tab" id="tab-comparativa" onclick="setCity('comparativa',this)" style="background:rgba(255,215,0,.18);border-color:rgba(255,215,0,.4)">📊 Comparativa destacados</button>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar colegio..." oninput="renderCards()"/>
  </div>
  <button class="filter-btn active" data-filter="todos" onclick="setFilter(this)">Todos</button>
  <button class="filter-btn" data-filter="Particular Pagado" onclick="setFilter(this)">Part. Pagado</button>
  <button class="filter-btn" data-filter="Particular Subvencionado" onclick="setFilter(this)">Subvencionado</button>
  <button class="filter-btn" data-filter="Municipal" onclick="setFilter(this)">Municipales</button>
  <select class="sort-select" id="sortBy" onchange="renderCards()">
    <option value="integral">Ordenar: Ranking integral</option>
    <option value="paes">Ordenar: PAES 2025</option>
    <option value="simce">Ordenar: SIMCE promedio</option>
    <option value="arancel_asc">Ordenar: Menor arancel</option>
    <option value="arancel_desc">Ordenar: Mayor arancel</option>
    <option value="nombre">Ordenar: Nombre A–Z</option>
  </select>
</div>

<!-- CARDS GRID -->
<div class="grid" id="grid"></div>

<!-- COMPARATIVA PANEL -->
<div id="comparativaPanel" style="display:none;max-width:1100px;margin:0 auto;padding:20px"></div>

<!-- ADMIN FAB — acceso oculto: doble clic en el header -->
<button class="admin-fab" onclick="openLogin()" style="display:none">⚙️ Panel Admin</button>
<div id="hiddenAdminZone" ondblclick="openLogin()" style="position:fixed;bottom:0;right:0;width:60px;height:60px;z-index:99;cursor:default" title=""></div>

<!-- ────── LOGIN MODAL ────── -->
<div class="overlay hidden" id="loginOverlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">Acceso administrativo</span>
      <button class="modal-close" onclick="closeOverlay('loginOverlay')">✕</button>
    </div>
    <div class="login-box">
      <div class="login-icon">🔐</div>
      <div class="login-title">Panel de administración</div>
      <div class="login-sub">Ingresa la contraseña para editar datos</div>
      <div class="login-error" id="loginError">Contraseña incorrecta</div>
      <input class="form-input" type="password" id="pwInput" placeholder="Contraseña"
        onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;margin-bottom:12px;text-align:center"/>
      <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:11px">Ingresar →</button>
      <p style="margin-top:14px;font-size:11px;color:var(--gray)">Contraseña inicial: <strong>admin2025</strong></p>
    </div>
  </div>
</div>

<!-- ────── ADMIN PANEL MODAL ────── -->
<div class="overlay hidden" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <span class="admin-title">⚙️ Panel de Administración</span>
      <button style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;
        padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600" onclick="closeOverlay('adminOverlay')">✕ Cerrar</button>
    </div>
    <div class="admin-body">
      <div class="admin-tabs">
        <button class="atab active" onclick="showAdminTab('list',this)">📋 Colegios</button>
        <button class="atab" onclick="showAdminTab('add',this)">➕ Agregar</button>
        <button class="atab" onclick="showAdminTab('ai',this)">🤖 Actualizar con IA</button>
        <button class="atab" onclick="showAdminTab('backup',this)">💾 Backup</button>
        <button class="atab" onclick="showAdminTab('password',this)">🔑 Contraseña</button>
        <button class="atab" onclick="showAdminTab('deploy',this)">🚀 Publicar Web</button>
      </div>
      <div id="adminContent"></div>
    </div>
  </div>
</div>

<!-- ────── EDIT MODAL ────── -->
<div class="overlay hidden" id="editOverlay">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title" id="editTitle">Editar colegio</span>
      <button class="modal-close" onclick="closeOverlay('editOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <form id="editForm" onsubmit="saveSchool(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label class="form-label">Nombre del colegio</label>
            <input class="form-input" id="f_nombre" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Ciudad / Comuna</label>
            <select class="form-select" id="f_ciudad">
              <option value="Rancagua">Rancagua</option>
              <option value="Machalí">Machalí</option>
              <option value="Graneros">Graneros</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select class="form-select" id="f_tipo">
              <option>Particular Pagado</option>
              <option>Municipal</option>
              <option>Particular Subvencionado</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Bilingüe</label>
            <select class="form-select" id="f_bilingue">
              <option value="false">No</option>
              <option value="true">Sí</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Rank PAES 2025 (nacional)</label>
            <input class="form-input" id="f_paes_rank" type="number" placeholder="Ej: 46 (dejar vacío si no aplica)"/>
          </div>
          <div class="form-group">
            <label class="form-label">Puntaje PAES 2025</label>
            <input class="form-input" id="f_paes_pts" type="number" step="0.01" placeholder="Ej: 814.45"/>
          </div>
          <div class="form-group">
            <label class="form-label">SIMCE Lectura (4° básico)</label>
            <input class="form-input" id="f_simce_lect" type="number" required/>
          </div>
          <div class="form-group">
            <label class="form-label">SIMCE Matemática (4° básico)</label>
            <input class="form-input" id="f_simce_mat" type="number" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Arancel mínimo ($/mes)</label>
            <input class="form-input" id="f_arancel_min" type="number" placeholder="0 si es gratuito"/>
          </div>
          <div class="form-group">
            <label class="form-label">Arancel máximo ($/mes)</label>
            <input class="form-input" id="f_arancel_max" type="number" placeholder="0 si es gratuito"/>
          </div>
          <div class="form-group">
            <label class="form-label">Matrícula anual ($)</label>
            <input class="form-input" id="f_matricula" type="number" placeholder="0 si es gratuito"/>
          </div>
          <div class="form-group">
            <label class="form-label">Fuente arancel</label>

const PASS_KEY = 'rkg_pass';
const DATA_KEY = 'rkg_schools';
const VER_KEY  = 'rkg_version';

function loadData(){
  try{
    const savedVer = localStorage.getItem(VER_KEY);
    const saved    = localStorage.getItem(DATA_KEY);
    if(savedVer !== DATA_VERSION || !saved){
      if(saved){
        const existing = JSON.parse(saved);
        // Build lookup map from DEFAULT_DATA to patch missing fields
        const defaultMap = {};
        DEFAULT_DATA.forEach(c => defaultMap[c.id] = c);
        // Patch ciudad on existing schools that don't have it
        const patched = existing.map(c => {
          if(!c.ciudad && defaultMap[c.id]) c.ciudad = defaultMap[c.id].ciudad;
          return c;
        });
        // Add brand new schools not in localStorage
        const existingIds = new Set(patched.map(c=>c.id));
        const newOnes = DEFAULT_DATA.filter(c=>!existingIds.has(c.id));
        schools = [...patched, ...newOnes];
      } else {
        schools = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      localStorage.setItem(VER_KEY, DATA_VERSION);
      saveData();
    } else {
      // Even on same version, patch ciudad if missing (safety net)
      const loaded = JSON.parse(saved);
      const defaultMap = {};
      DEFAULT_DATA.forEach(c => defaultMap[c.id] = c);
      schools = loaded.map(c => {
        if(!c.ciudad && defaultMap[c.id]) c.ciudad = defaultMap[c.id].ciudad;
        return c;
      });
    }
  }catch(e){
    schools = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}
function saveData(){ localStorage.setItem(DATA_KEY, JSON.stringify(schools)); }
function getPass(){ return localStorage.getItem(PASS_KEY) || 'admin2025'; }
function setPass(p){ localStorage.setItem(PASS_KEY, p); }

function integralScore(c){
  const paes = c.paes_pts ? (c.paes_pts - 700)/200 : 0;
  const simce = ((c.simce_lect + c.simce_mat)/2 - 200)/200;
  return (paes * .5 + simce * .5) * 100;
}

function clp(n){ return n === 0 ? 'Gratis' : '$' + n.toLocaleString('es-CL'); }
function clpShort(n){ return n === 0 ? 'Gratis' : '$' + Math.round(n/1000) + 'K'; }

function renderKpis(){
  const citySchools = currentCity === 'todas' ? schools : schools.filter(c=>(c.ciudad||'Rancagua')===currentCity);
  const top100 = citySchools.filter(c=>c.paes_rank).length;
  const maxPaes = citySchools.filter(c=>c.paes_pts).sort((a,b)=>b.paes_pts-a.paes_pts)[0];
  const maxArancel = Math.max(...citySchools.map(c=>c.arancel_max),0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span class="kpi-icon">🏆</span><div>
      <div class="kpi-label">Top 100 PAES</div><div class="kpi-val">${top100} colegios</div></div></div>
    <div class="kpi"><span class="kpi-icon">📊</span><div>
      <div class="kpi-label">Líder PAES</div><div class="kpi-val">${maxPaes ? maxPaes.paes_pts + ' pts' : '—'}</div></div></div>
    <div class="kpi"><span class="kpi-icon">💰</span><div>
      <div class="kpi-label">Arancel máx.</div><div class="kpi-val">${clpShort(maxArancel)}/mes</div></div></div>
    <div class="kpi"><span class="kpi-icon">🏫</span><div>
      <div class="kpi-label">Total colegios</div><div class="kpi-val">${citySchools.length}</div></div></div>
  `;
}

function getSorted(){
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sortBy').value;
  let list = schools.filter(c => {
    const matchCity = currentCity === 'todas' || (c.ciudad || 'Rancagua') === currentCity;
    const matchFilter = currentFilter === 'todos' || c.tipo === currentFilter;
    const matchSearch = !q || c.nombre.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
    return matchCity && matchFilter && matchSearch;
  });
  if(sort==='paes') list.sort((a,b)=>(b.paes_pts||0)-(a.paes_pts||0));
  else if(sort==='simce') list.sort((a,b)=>((b.simce_lect+b.simce_mat)/2)-((a.simce_lect+a.simce_mat)/2));
  else if(sort==='arancel_asc') list.sort((a,b)=>((a.arancel_min+a.arancel_max)/2)-((b.arancel_min+b.arancel_max)/2));
  else if(sort==='arancel_desc') list.sort((a,b)=>((b.arancel_min+b.arancel_max)/2)-((a.arancel_min+a.arancel_max)/2));
  else if(sort==='nombre') list.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  else list.sort((a,b)=>integralScore(b)-integralScore(a));
  return list;
}

        <div class="card-rank">
          <span class="rank-badge" style="background:${c.color}18;color:${c.color}">#${rankLocal} ${cityLabel}</span>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end">

            ${c.bilingue?'<span class="bilingue-tag">EN</span>':''}
          </div>
        </div>

        <div class="card-desc">${c.desc}</div>
        <div class="metrics">

            <div class="metric-label">PAES 2025</div>
            <div class="metric-val" style="font-size:${c.paes_pts?'18px':'14px'}">${c.paes_pts||'—'}</div>
            <div class="metric-sub">${c.paes_rank?'#'+c.paes_rank+' nac.':'Sin top 100'}</div>
          </div>
          <div class="metric">
            <div class="metric-label">SIMCE Lect</div>
            <div class="metric-val">${c.simce_lect}</div>
            <div class="metric-sub" style="color:${c.simce_lect>=278?'var(--green)':'var(--red)'}">${c.simce_lect>=278?'+':''}${c.simce_lect-278} vs nac</div>
          </div>
          <div class="metric">
            <div class="metric-label">SIMCE Mat</div>
            <div class="metric-val">${c.simce_mat}</div>
            <div class="metric-sub" style="color:${c.simce_mat>=264?'var(--green)':'var(--red)'}">${c.simce_mat>=264?'+':''}${c.simce_mat-264} vs nac</div>

          </div>
          <div class="arancel-val ${c.arancel_max===0?'arancel-gratis':'arancel-paid'}">${arancelStr}</div>

  }).join('');
}

function selectAIMode(mode, btn){
  _aiMode = mode;
  document.querySelectorAll('[id^="ai-mode-"]').forEach(function(b){b.style.background='';b.style.borderColor='';b.style.color='';});
  btn.style.background='#e8f0fe'; btn.style.borderColor='var(--blue)'; btn.style.color='var(--blue)';
}

function generatePrompt(){
  var summary = schools.map(function(c){
    return '- ' + c.nombre + ' (' + (c.ciudad||'Rancagua') + ') | PAES rank: ' + (c.paes_rank||'—') + ', pts: ' + (c.paes_pts||'—') + ' | SIMCE Lect: ' + c.simce_lect + ', Mat: ' + c.simce_mat + ' | Arancel: ' + (c.arancel_max===0 ? 'Gratuito' : '$' + c.arancel_min + '–$' + c.arancel_max + '/mes');
  }).join('\n');
  var instruccion = {
    all: 'PAES 2025 (ranking nacional y puntaje), SIMCE 4° básico 2024 (lectura y matemática) y aranceles 2025',
    paes: 'ranking PAES 2025 (puesto nacional y puntaje promedio)',
    simce: 'puntajes SIMCE 4° básico 2024 (lectura y matemática)',
    arancel: 'aranceles y mensualidades 2025'
  }[_aiMode];
  var prompt = 'Eres un experto en educación chilena. Busca en la web los datos más recientes de ' + instruccion + ' para los siguientes colegios de la Región de O\'Higgins, Chile.\n\nDATOS ACTUALES EN LA APP:\n' + summary + '\n\nINSTRUCCIONES:\n1. Usa búsqueda web para encontrar datos actualizados.\n2. Compara con los datos actuales y detecta diferencias.\n3. Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional ni markdown.\n\nFORMATO (solo JSON puro):\n{"actualizaciones":[{"nombre":"Nombre exacto del colegio","campo":"paes_rank|paes_pts|simce_lect|simce_mat|arancel_min|arancel_max","valor_actual":"valor actual","valor_nuevo":"valor nuevo","fuente":"fuente o URL","confianza":"alta|media|baja"}],"resumen":"Resumen breve en español"}\n\nSi no hay cambios: {"actualizaciones":[],"resumen":"No se encontraron diferencias."}';
  document.getElementById('promptText').value = prompt;
  document.getElementById('promptBox').style.display = 'block';
  copyPrompt();
}

function copyPrompt(){
  var txt = document.getElementById('promptText');
  if(!txt) return;
  txt.select(); document.execCommand('copy');
  var cc = document.getElementById('copyConfirm');
  if(cc){ cc.style.display='block'; setTimeout(function(){cc.style.display='none';},5000); }
  notify('📋 Prompt copiado — pégalo en Claude.ai');
  localStorage.setItem('rkg_last_ai_check', Date.now().toString());
}

function processAIResponse(){
  var raw = document.getElementById('aiResponseInput').value.trim();
  if(!raw){ notify('⚠️ Pega la respuesta de Claude primero'); return; }
  var parsed;
  try{
    var clean = raw.replace(/```json|```/g,'');
    var m = clean.match(/\{[\s\S]*\}/);
    parsed = m ? JSON.parse(m[0]) : null;
  }catch(e){ parsed = null; }
  var resultsEl = document.getElementById('aiResults');
  if(!parsed || !Array.isArray(parsed.actualizaciones)){
    resultsEl.style.display='block';
    resultsEl.innerHTML='<div style="background:#fee2e2;border-radius:12px;padding:16px;border-left:4px solid var(--red)"><strong>❌ JSON inválido</strong><br><span style="font-size:12px;color:var(--gray)">Copia exactamente el bloque JSON de la respuesta de Claude.</span></div>';
    return;
  }
  localStorage.setItem('rkg_last_ai_check', Date.now().toString());
  renderAIResults(parsed);
}

function renderAIResults(data){
  var resultsEl = document.getElementById('aiResults');
  resultsEl.style.display = 'block';
  var updates = data.actualizaciones || [];
  var confianzaColor = {alta:'#15803d',media:'#b45309',baja:'#6b7280'};
  var confianzaBg = {alta:'#dcfce7',media:'#fef9c3',baja:'#f1f5f9'};
  var campoLabel = {paes_rank:'Rank PAES',paes_pts:'Puntaje PAES',simce_lect:'SIMCE Lectura',simce_mat:'SIMCE Matemática',arancel_min:'Arancel mínimo',arancel_max:'Arancel máximo'};
  if(!updates.length){
    resultsEl.innerHTML='<div style="background:#f0fdf4;border-radius:12px;padding:20px;border-left:4px solid var(--green);text-align:center"><div style="font-size:32px;margin-bottom:8px">✅</div><strong style="color:var(--green)">¡Todo actualizado!</strong><p style="font-size:13px;color:var(--gray);margin-top:4px">' + (data.resumen||'Sin diferencias.') + '</p></div>';
    return;
  }
  window._aiUpdates = updates;
  var rows = updates.map(function(u,i){
    var conf = u.confianza||'baja';
    var nombre_safe = u.nombre.replace(/'/g,"\\'").substring(0,30);
    return '<div id="ai-row-'+i+'" style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap">'
      + '<div style="flex:1;min-width:160px">'
      + '<div style="font-weight:700;font-size:13px;color:var(--navy)">'+u.nombre+'</div>'
      + '<div style="font-size:12px;color:var(--gray);margin-top:2px">'+(campoLabel[u.campo]||u.campo)+': <s style="color:#aaa">'+u.valor_actual+'</s> → <strong style="color:var(--blue)">'+u.valor_nuevo+'</strong></div>'
      + '<div style="font-size:10px;color:var(--gray);margin-top:2px">Fuente: '+(u.fuente||'—')+'</div></div>'
      + '<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;background:'+confianzaBg[conf]+';color:'+confianzaColor[conf]+'">'+conf.toUpperCase()+'</span>'
      + '<div style="display:flex;gap:6px">'
      + '<button class="btn btn-success btn-sm" onclick="applyOneAI('+i+',\''+nombre_safe+'\',\''+u.campo+'\','+( parseFloat(u.valor_nuevo)||0)+')">✅</button>'
      + '<button class="btn btn-danger btn-sm" onclick="document.getElementById(\'ai-row-'+i+'\').remove()">✕</button>'
      + '</div></div>';
  }).join('');
  resultsEl.innerHTML='<div style="background:white;border-radius:12px;padding:20px;box-shadow:var(--shadow)">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    + '<div><div style="font-weight:800;font-size:15px;color:var(--navy)">📋 Sugerencias ('+updates.length+')</div>'
    + '<div style="font-size:12px;color:var(--gray);margin-top:2px">'+(data.resumen||'')+'</div></div>'
    + '<button class="btn btn-success" onclick="applyAllAI()">✅ Aplicar todas</button></div>'
    + rows + '</div>';
}

function applyOneAI(idx, nombre, campo, valor){
  var school = schools.find(function(s){ return s.nombre.toLowerCase().indexOf(nombre.toLowerCase())>=0; });
  if(school && campo in school){
    school[campo]=valor; saveData(); renderCards(); renderKpis();
    var row=document.getElementById('ai-row-'+idx);
    if(row) row.style.background='#f0fdf4';
    notify('✅ Actualizado: '+school.nombre);
  } else { notify('⚠️ No encontrado: '+nombre); }
}

function applyAllAI(){
  if(!window._aiUpdates) return;
  var applied=0;
  window._aiUpdates.forEach(function(u){
    var school=schools.find(function(s){ return s.nombre.toLowerCase().indexOf(u.nombre.toLowerCase().substring(0,15))>=0; });
    var valor=parseFloat(u.valor_nuevo)||0;
    if(school && u.campo in school){school[u.campo]=valor;applied++;}
  });
  saveData(); renderCards(); renderKpis();
  notify('✅ '+applied+' cambios aplicados');
  document.querySelectorAll('[id^="ai-row-"]').forEach(function(r){r.style.background='#f0fdf4';});
}
